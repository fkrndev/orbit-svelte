name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same PR makes the first run irrelevant, so stop it rather
# than paying for both.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Frozen, because a lockfile that drifts silently in CI defeats the point
      # of committing one — and this project ships patches keyed to exact
      # versions of BlockNote and prosemirror-tables.
      - run: bun install --frozen-lockfile

      # Electrobun 2.x keeps its SDK out of node_modules; Hutch projects it into
      # the gitignored .hutch/devkit. Without this step every `electrobun/*`
      # import is unresolved and typecheck fails on a clean checkout.
      - name: Sync Electrobun devkit
        run: bun run sync

      - name: Typecheck
        run: bun run typecheck

      # `bun run test` (vitest), never `bun test` — Bun's own runner has no DOM
      # and fails the editor suite for reasons unrelated to any change.
      - name: Test
        run: bun run test

      # The webview build is the artifact the desktop app ships; a build that
      # only breaks under Rollup would otherwise reach main with everything
      # else green.
      - name: Build webview
        run: bunx vite build
